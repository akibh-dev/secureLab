id: MVP-02
slug: tenant-isolation
title: Tenant Isolation
module: authorization
objective: Scope documents using verified tenant membership.
version: 1
minutes: 12
difficulty: Beginner
prerequisites:
  - MVP-01
invariants:
  rule: Scope documents using verified tenant membership.
references:
  - label: OWASP API Security Top 10 (2023) · API1
    url: https://owasp.org/API-Security/editions/2023/en/0x11-t10/
mode: choose-fix
routes:
  - GET /api/documents/:documentId
options:
  - id: owner-only
    label: Require verified tenant and ownership
    checks:
      - tenant
      - owner
    effect: access
  - id: tenant-scope
    label: Require the verified tenant to match
    checks:
      - signed-in
      - tenant
    effect: access
solution: tenant-scope
cases:
  - id: own-tenant
    label: A member reads a document in their tenant
    invariant: rule
    action: read
    fixture:
      actor: &a2
        id: reader-a
        tenant: north
        permissions:
          - read
          - list
      resource: &a1
        tenant: north
        owner: owner-a
        members:
          - reader-a
          - owner-a
        visibility: team
        open: true
    expected:
      outcome: allowed
    group: behavior
    weight: 20
  - id: other-tenant
    label: Another tenant receives a restricted result
    invariant: rule
    action: read
    fixture:
      actor:
        id: reader-b
        tenant: south
        permissions:
          - read
      resource: *a1
    expected: &a3
      outcome: restricted
    group: boundary
    weight: 30
  - id: unavailable
    label: An unavailable document reveals no details
    invariant: rule
    action: read
    fixture:
      actor: *a2
      resource: null
    expected: *a3
    group: boundary
    weight: 10
  - id: trusted-context
    label: Verified context determines tenant scope
    invariant: rule
    action: read
    fixture:
      actor: *a2
      resource: *a1
      suppliedTenant: south
    expected:
      outcome: allowed
    group: behavior
    weight: 25
  - id: no-membership
    label: An account without a verified tenant is restricted
    invariant: rule
    action: read
    fixture:
      actor:
        id: guest
        permissions:
          - read
      resource: *a1
    expected: *a3
    group: boundary
    weight: 15
hints:
  - Find the trusted source of tenant membership.
  - Apply verified tenant scope to the initial lookup.
  - Compare the authenticated tenant to the owning tenant before returning a
    record.
correctReason: principle
reasoning:
  - id: principle
    label: Verified membership defines the workspace boundary.
  - id: alternate
    label: Only the document owner can read a tenant-wide record.
